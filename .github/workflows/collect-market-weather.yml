name: Collect Kalshi opening forecasts

on:
  schedule:
    # Hourly discovery/recovery covers openings that move or differ by city.
    - cron: "7 * * * *"
    # Warm runner near 10 AM ET in both DST and standard time. Actual open_time
    # is read from Kalshi; these are polling opportunities, not assumed openings.
    - cron: "57 13,14 * * *"
  workflow_dispatch:
    inputs:
      opening_pilot:
        description: Keep the collector warm for the usual 10 AM Eastern market opening
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Both data-writing workflows share this group to avoid conflicting commits.
concurrency:
  group: daily-weather-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Record runner readiness
        run: echo "RUNNER_READY_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collection.txt
      - name: Install collection dependencies
        run: python -m pip install -r requirements-collection.txt
      - name: Discover markets and capture opening forecasts
        id: collect
        continue-on-error: true
        env:
          METEOSOURCE_API_KEY: ${{ secrets.METEOSOURCE_API_KEY }}
          METEOSOURCE_TIER: ${{ vars.METEOSOURCE_TIER }}
          METEOSOURCE_ARCHIVAL_ALLOWED: ${{ vars.METEOSOURCE_ARCHIVAL_ALLOWED }}
          PIRATE_WEATHER_API_KEY: ${{ secrets.PIRATE_WEATHER_API_KEY }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          TOMORROW_API_KEYS: ${{ secrets.TOMORROW_API_KEYS }}
          TOMORROW_ARCHIVAL_ALLOWED: ${{ vars.TOMORROW_ARCHIVAL_ALLOWED }}
          OPENING_PILOT: ${{ inputs.opening_pilot }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          args=()
          if [[ "$OPENING_PILOT" == "true" ]]; then
            args+=(--opening-pilot)
          elif [[ -n "$TRIGGER_SCHEDULE" ]]; then
            # If a scheduled runner happens to be ready near 10 ET, use it as well.
            args+=(--opening-pilot)
            if [[ "$TRIGGER_SCHEDULE" == "57 13,14 * * *" ]]; then
              args+=(--wait-seconds 300)
            fi
          fi
          python src/collect_market_forecasts.py "${args[@]}"
      - name: Attach workflow timing
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/record_workflow_timing.py
      - name: Migrate permitted archives
        id: migration
        continue-on-error: true
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python src/migrate_archives.py --apply

      - name: Report collection health and accuracy
        id: reports
        continue-on-error: true
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python src/report_collection.py --out-dir data/verification/market --github-summary
      - name: Commit collected market data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new market data to commit."
            exit 0
          fi
          git commit -m "data: collect market opening snapshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Report collection failure
        if: steps.migration.outcome == 'failure' || steps.collect.outcome == 'failure' || steps.reports.outcome == 'failure'
        run: exit 1

name: Collect daily weather data

on:
  schedule:
    # 12:17 UTC avoids GitHub's busiest scheduling boundary and is early
    # morning at every configured US station.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Replace an existing forecast snapshot for the current UTC day
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-weather-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Record runner readiness
        run: echo "RUNNER_READY_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collection.txt

      - name: Install collection dependencies
        run: python -m pip install -r requirements-collection.txt

      - name: Collect forecasts
        id: forecasts
        continue-on-error: true
        shell: bash
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          METEOSOURCE_API_KEY: ${{ secrets.METEOSOURCE_API_KEY }}
          METEOSOURCE_TIER: ${{ vars.METEOSOURCE_TIER }}
          METEOSOURCE_ARCHIVAL_ALLOWED: ${{ vars.METEOSOURCE_ARCHIVAL_ALLOWED }}
          PIRATE_WEATHER_API_KEY: ${{ secrets.PIRATE_WEATHER_API_KEY }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          WEATHERBIT_API_KEY: ${{ secrets.WEATHERBIT_API_KEY }}
          WEATHERBIT_ARCHIVAL_ALLOWED: ${{ vars.WEATHERBIT_ARCHIVAL_ALLOWED }}
          TOMORROW_API_KEYS: ${{ secrets.TOMORROW_API_KEYS }}
          TOMORROW_ARCHIVAL_ALLOWED: ${{ vars.TOMORROW_ARCHIVAL_ALLOWED }}
          # These are intentionally not passed to the collector because their
          # standard forecast terms limit retention to 24 hours:
          # GOOGLE_MAPS_DEMO_API_KEY
          # WEATHERAPI_API_KEY
        run: |
          args=()
          if [[ "${{ inputs.refresh }}" == "true" ]]; then
            args+=(--refresh)
          fi
          python src/collect_forecasts.py "${args[@]}"

      - name: Attach workflow timing
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/record_workflow_timing.py

      - name: Migrate permitted archives
        id: migration
        continue-on-error: true
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python src/migrate_archives.py --apply

      - name: Collect observations
        id: observations
        continue-on-error: true
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python src/collect_observations.py

      - name: Refresh relevant settlements
        id: settlements
        continue-on-error: true
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python src/refresh_settlements.py

      - name: Report collection health and accuracy
        id: reports
        continue-on-error: true
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python src/report_collection.py --out-dir data/verification/daily --github-summary

      - name: Commit collected data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "data: collect weather snapshots $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Report collection failure
        if: steps.migration.outcome == 'failure' || steps.forecasts.outcome == 'failure' || steps.observations.outcome == 'failure' || steps.settlements.outcome == 'failure' || steps.reports.outcome == 'failure'
        shell: bash
        run: |
          echo "Collection or reporting failed after saving successful responses."
          exit 1

name: Test pipeline

on:
  pull_request:
    paths: ["src/**", "tests/**", "config/**", "data/verification/**", "requirements*.txt", ".github/workflows/**"]
  push:
    paths: ["src/**", "tests/**", "config/**", "requirements*.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/public_reports.test.mjs
